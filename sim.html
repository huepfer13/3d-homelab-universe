<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Universe Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#020208;color:#00ffcc;font-family:monospace;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#hud{background:rgba(5,10,25,.95);border:1px solid #00ffcc44;border-radius:10px;padding:20px 30px;min-width:320px;text-align:center;}
h1{font-size:18px;color:#fff;margin-bottom:4px;letter-spacing:2px;}
.sub{font-size:10px;color:#0cf;margin-bottom:16px;opacity:.7;}
.m{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;padding:4px 0;border-bottom:1px solid #0cf1;}
.m span{color:#fff;font-weight:bold;}
#log{position:fixed;bottom:10px;left:20px;right:20px;background:rgba(5,5,15,.9);border:1px solid #0cf3;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;z-index:10;}
#log .title{color:#0fc;font-size:11px;font-weight:bold;margin-bottom:6px;border-bottom:1px solid #0cf3;padding-bottom:4px;}
#log .entry{font-size:10px;padding:2px 6px;margin:1px 0;border-radius:3px;}
.e-success{border-left:2px solid #0f8;background:rgba(0,255,136,.05);color:#0f8;}
.e-error{border-left:2px solid #f33;background:rgba(255,51,51,.08);color:#f33;}
.e-warning{border-left:2px solid #fa0;background:rgba(255,170,0,.05);color:#fa0;}
#banner{position:fixed;top:10px;right:10px;background:rgba(255,100,0,.15);border:1px solid rgba(255,100,0,.4);color:#fa0;padding:6px 14px;border-radius:5px;font-size:11px;z-index:20;}
</style>
</head>
<body>
<div id="hud">
<h1>3D UNIVERSE</h1>
<div class="sub">Simulation Demo</div>
<div class="m">Nodes: <span id="nc">5 Active</span></div>
<div class="m">Status: <span id="st">● Running</span></div>
<div class="m">Connections: <span id="cc">15 Links</span></div>
<div class="m">Uptime: <span id="up">0s</span></div>
</div>
<div id="banner">⚠ Simulation — 3D unavailable</div>
<div id="log"><div class="title">EVENT STREAM</div><div id="entries"></div></div>

<script>
// ═══ PURE SIMULATION — no external deps ═══
const NODES=['Alpha','Beta','Gamma','Delta','Epsilon'];
const SVCS=['API','DB','Cache','Queue','Worker','Gateway','Proxy'];
const STAGES=['Init','Build','Test','Deploy','Done'];
const TYPES=['deploy','data','ping','sync','backup','health'];
const STATUS=['success','success','success','warning','error'];

let tick=0, start=Date.now();

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function simNode(){return 'Node-'+String.fromCharCode(65+Math.floor(Math.random()*5))+Math.ceil(Math.random()*5);}

function simMsg(){
    tick++;
    const from=simNode(),to=simNode();if(from===to)return simMsg();
    const type=rnd(TYPES),status=rnd(STATUS);
    const titles={deploy:'Deploy '+rnd(SVCS)+' '+rnd(STAGES),data:'Sync '+rnd(SVCS),
        ping:'Heartbeat '+from, sync:'Replicate '+rnd(SVCS),
        backup:'Backup '+rnd(STAGES), health:'Health '+from};
    const e=document.createElement('div');
    e.className='entry e-'+status;
    e.textContent='['+new Date().toLocaleTimeString()+'] '+titles[type];
    const c=document.getElementById('entries');
    c.insertBefore(e,c.firstChild);
    if(c.children.length>50)c.lastChild.remove();
}

function fl(){
    document.getElementById('nc').textContent=5+Math.floor(Math.random()*3)+' Active';
    document.getElementById('st').textContent=(tick%10===0?'⚠ Warning':tick%7===0?'● Error':'● Running');
    document.getElementById('st').style.color=tick%10===0?'#fa0':tick%7===0?'#f33':'#0f8';
    document.getElementById('cc').textContent=(12+Math.floor(Math.random()*8))+' Links';
    document.getElementById('up').textContent=Math.floor((Date.now()-start)/1000)+'s';
}

setInterval(simMsg,800);
setInterval(fl,3000);
fl();
</script>
</body>
</html>
