<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Simulation</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020208;color:#0fc;font-family:monospace;padding:20px}
h1{color:#fff;border-bottom:1px solid #0fc;padding-bottom:8px;margin-bottom:12px;font-size:18px}
.g{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.galaxy{border:1px solid rgba(0,255,204,.3);border-radius:8px;padding:10px;min-width:160px;background:rgba(0,255,204,.03)}
.galaxy h2{font-size:13px;color:#08f;margin-bottom:6px}
.ct{font-size:10px;padding:2px 0;color:#aaa}
.event{font-size:10px;padding:2px 4px;border-left:2px solid #0fc;margin:2px 0;color:#888}
#log{max-height:300px;overflow-y:auto;border:1px solid rgba(0,255,204,.2);border-radius:6px;padding:8px;margin-top:12px}
#log h3{font-size:11px;color:#0fc;margin-bottom:6px}
</style></head><body>
<h1>◈ Homelab Universe Simulation</h1>
<div class="g" id="galaxies"></div>
<div id="stats" style="font-size:10px;color:#666;margin-bottom:8px;"></div>
<div id="log"><h3>Event Stream</h3><div id="entries"></div></div>
<script>
var G=['Alpha','Beta','Gamma','Delta','Epsilon'];
var C=['API','DB','Cache','Queue','Worker'];
var S=['ok','ok','ok','ok','busy','error'];
var gd=document.getElementById('galaxies');
var ed=document.getElementById('entries');
var sd=document.getElementById('stats');
var c=0,e=0;
G.forEach(function(n,i){
    var h='<div class="galaxy"><h2>&#x1F4A0; '+n+'</h2>';
    for(var j=1;j<=5;j++){
        var s=S[Math.floor(Math.random()*S.length)];
        var cl=s==='error'?'#f33':s==='busy'?'#fa0':'#0f8';
        h+='<div class="ct"><span style="color:'+cl+'">&#x25CF;</span> '+n+'-C'+j+'</div>';
    }
    h+='</div>';
    gd.innerHTML+=h;
});
function tick(){
    c++;
    sd.textContent='Ticks: '+c+' | Events: '+e+' | Uptime: '+Math.floor(c*0.8)+'s';
    var g=G[Math.floor(Math.random()*5)];
    var ct=Math.ceil(Math.random()*5);
    var sv=C[Math.floor(Math.random()*5)];
    var st=S[Math.floor(Math.random()*S.length)];
    var cl=st==='error'?'#f33':st==='busy'?'#fa0':'#0f8';
    var ts=new Date().toLocaleTimeString();
    ed.innerHTML+='<div class="event" style="border-left-color:'+cl+'">['+ts+'] <b>'+g+'-C'+ct+'</b> '+sv+': <span style="color:'+cl+'">'+st+'</span></div>';
    e++;
    if(ed.children.length>50)ed.removeChild(ed.firstChild);
    ed.scrollTop=ed.scrollHeight;
}
setInterval(tick,800);
tick();
</script>
</body></html>
