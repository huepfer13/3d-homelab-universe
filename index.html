<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Universe Demo</title>
<style>
body{margin:0;padding:0;overflow:hidden;width:100vw;height:100vh;background:#050510;font-family:'Segoe UI',Tahoma,sans-serif;color:#00ffcc;position:fixed;overscroll-behavior:none;}
canvas{position:fixed;top:0;left:0;width:100vw!important;height:100vh!important;z-index:1;}
#canvas-container{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;z-index:1;}
#hud{position:absolute;top:20px;left:20px;background:rgba(5,10,25,0.9);border:1px solid #00ffcc44;padding:15px 20px;border-radius:8px;z-index:10;max-width:340px;}
#hud button,#hud select{pointer-events:auto}
h1{font-size:16px;margin:0 0 10px;color:#fff;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #00ffcc33;padding-bottom:5px;}
.metric{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;}
.metric span{color:#fff;font-weight:bold;}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:1px solid rgba(0,255,204,0.3);border-radius:50%;pointer-events:none;z-index:25;}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,204,0.15);}
#crosshair::before{top:50%;left:0;right:0;height:1px;transform:translateY(-50%);}
#crosshair::after{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);}
.node-label{position:absolute;left:0;top:0;background:rgba(5,10,20,0.85);border:1px solid #00ffcc44;color:#00ffcc;padding:3px 10px;font-size:10px;border-radius:4px;pointer-events:none;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);text-shadow:0 0 6px rgba(0,255,204,0.5);}
#tooltip{position:absolute;display:none;background:rgba(10,5,25,0.95);border:1px solid #ff00ff;color:#fff;padding:10px 14px;font-size:12px;border-radius:6px;pointer-events:none;z-index:20;box-shadow:0 0 20px rgba(255,0,255,0.5);max-width:280px;}
#tooltip .title{color:#ff00ff;font-weight:bold;margin-bottom:4px;font-size:13px;}
#tooltip .meta{color:#aaa;font-size:11px;}
.packet-label{position:absolute;left:0;top:0;background:rgba(10,5,15,0.9);border:1px solid rgba(255,0,255,0.4);color:#ffccff;padding:1px 4px;font-size:9px;border-radius:3px;pointer-events:none;white-space:nowrap;transform:translate(8px,-8px);z-index:10;}
.legend-toggle:hover{color:#fff!important}.legend-subitem:hover{color:#0fc!important;text-shadow:0 0 5px rgba(0,255,204,.6);padding-left:3px!important;transition:all .15s ease;}
.task-item{margin:3px 0;padding:4px 6px;border-radius:3px;font-size:10px;cursor:pointer;transition:all .2s;}
.task-success{border:1px solid #0f8;background:rgba(0,255,136,.08);box-shadow:0 0 6px rgba(0,255,136,.25);color:#0f8;}
.task-error{border:1px solid #f33;background:rgba(255,51,51,.12);box-shadow:0 0 10px rgba(255,51,51,.5);color:#f33;animation:pulse-red 1.5s infinite;}
.task-warning{border:1px solid #fa0;background:rgba(255,170,0,.08);box-shadow:0 0 6px rgba(255,170,0,.25);color:#fa0;}
.task-pending{border:1px solid #666;background:rgba(100,100,100,.08);color:#aaa;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 5px rgba(255,51,51,.3)}50%{box-shadow:0 0 15px rgba(255,51,51,.8)}}
.task-children{padding-left:12px;margin-top:2px;border-left:1px dashed rgba(0,255,204,.25);display:none;}
.task-item:hover{filter:brightness(1.2);}
.profile-buttons{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.profile-btn{flex:1;min-width:60px;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.3);color:#0fc;padding:3px 5px;border-radius:3px;cursor:pointer;font-family:monospace;font-size:9px;transition:all .2s;}
.profile-btn.active,.profile-btn:hover{background:rgba(0,255,136,.2);border-color:#00ff88;color:#fff;}
.filter-checkboxes{display:flex;flex-wrap:wrap;gap:4px 8px;}
.checkbox-label{font-size:9px;color:#aaa;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;}
.checkbox-label input{accent-color:#00ff88;margin:0;width:10px;height:10px;}
/* ─── Inspection Modal ─── */
.modal-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(5,5,16,0.85);backdrop-filter:blur(8px);z-index:9999;display:flex;justify-content:center;align-items:center;}
.inspect-modal-content{background:#0d0d21;border:1px solid rgba(255,255,255,0.15);border-radius:12px;width:650px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 15px 35px rgba(0,0,0,0.6);color:#e0e0e8;font-family:inherit;}
.modal-header{padding:15px 20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{margin:0;font-size:1.1rem;color:#00ff88;}
.close-btn{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0 5px;}
.modal-body{padding:20px;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:10px;}
.info-row{font-size:0.9rem;line-height:1.4;}
.info-row p{margin:4px 0 0 0;color:#b0b0c0;font-size:0.85rem;}
#modal-raw-data{width:100%;height:120px;background:#050510;border:1px solid rgba(255,255,255,0.1);color:#00ff88;padding:10px;border-radius:6px;font-family:monospace;font-size:10px;resize:none;box-sizing:border-box;}
.modal-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:flex-end;gap:10px;}
.action-btn{background:#00ff88;color:#050510;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;transition:opacity .2s;font-family:monospace;font-size:11px;}
.action-btn.close-btn{background:rgba(255,255,255,0.1);color:#fff;}
.action-btn:hover{opacity:0.85;}
</style>

        <h1 style="font-size:13px; margin:0 0 6px; color:#fff; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #00ffcc33; padding-bottom:4px;">3D UNIVERSE</h1>
        <div class="metric">Nodes: <span id="node-count" style="color:#0088ff;">5 Nodes</span></div>

        <div style="margin-top:6px; display:flex; gap:4px;">
            <button id="center-btn" style="flex:1; background:rgba(0,255,204,.15); border:1px solid #0fc; color:#0fc; padding:4px 6px; border-radius:4px; cursor:pointer; font-family:monospace; font-size:10px; font-weight:bold;">⌖ CENTER</button>
            <button id="cfg-btn" style="flex:1; background:rgba(0,255,204,.1); border:1px solid rgba(0,255,204,.5); color:#0fc; padding:4px 6px; border-radius:4px; cursor:pointer; font-family:monospace; font-size:10px;">⚙ KONFIG</button>

        <div style="color:#00ff88; font-weight:bold; margin-bottom:6px; flex-shrink:0;">📡 HOMELAB EVENT STREAM</div>
        <input id="log-filter" placeholder="Filter..." style="width:100%; background:rgba(0,0,0,.5); border:1px solid rgba(0,255,204,.3); color:#0fc; padding:3px 6px; font-size:9px; border-radius:3px; margin-bottom:4px; font-family:monospace; flex-shrink:0;" oninput="filterLog()">

<div id="cfg-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:85vw;max-width:1000px;height:85vh;background:rgba(10,10,35,0.9);border:1px solid rgba(0,255,136,0.6);border-radius:12px;z-index:10000;box-shadow:0 0 40px rgba(0,255,136,0.2);flex-direction:column;font-family:monospace;color:#fff;backdrop-filter:blur(8px);">
<div style="padding:15px 20px;border-bottom:1px solid rgba(0,255,136,0.3);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);">

<span style="font-size:11px;color:#aaa;">Universum bleibt im Hintergrund sichtbar</span></div>
<div style="display:flex;align-items:center;gap:10px;"><select id="preset-select" onchange="loadPreset(this.value)" style="background:#111;color:#0fc;border:1px solid #00ff88;padding:4px 8px;border-radius:4px;font-family:monospace;font-size:11px;"><option value="">📂 Preset laden...</option></select><button id="cfg-close" style="background:none;border:none;color:#00ff88;font-size:18px;cursor:pointer;">✖</button></div>

<div id="config-editor" style="flex:1;padding:15px 20px;overflow-y:auto;background:rgba(0,0,0,0.15);"><input id="cfg-search" placeholder="🔍 Filter (Name, ID, IP)..." oninput="filterConfigEntries()" style="width:100%;background:rgba(0,0,0,0.5);border:1px solid rgba(0,255,136,0.3);color:#0fc;padding:6px 10px;border-radius:4px;font-family:monospace;font-size:11px;margin-bottom:12px;"><div id="section-editor"></div></div></div>

<script>
// ═══ SIMULATION DATA ═══
let simCount=0;
const SVCS=['API','DB','Cache','Queue','Worker'];
const STAGES=['Init','Build','Test','Deploy','Done'];
const MSG_TYPES=['deploy','data','ping','issue','error','sync','backup','health'];
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ═══ THREE.JS 3D SCENE ═══
let R,scene,cam,controls,U,PkG,cl;
const C=document.getElementById('canvas-container');
scene=new THREE.Scene();
cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1200);cam.position.set(0,25,70);cam.lookAt(0,0,-12);
U=new THREE.Group();scene.add(U);
window.universeLayers=window.universeLayers||{switches:[],hypervisors:[],containers:[],iot:[],trails:[],halos:[]};
PkG=new THREE.Group();U.add(PkG);window.universeLayers.trails.push(PkG);
// WebGL renderer with auto-retry + context loss recovery
function initWebGL(){
    try{
        if(typeof THREE==='undefined')throw new Error('THREE not loaded');
        R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
        R.setSize(innerWidth,innerHeight);R.setPixelRatio(devicePixelRatio);R.setClearColor(0x0a0a2e);C.appendChild(R.domElement);
        R.domElement.addEventListener('webglcontextlost',function(e){e.preventDefault();console.warn('[GPU] Context lost — pausing');
            if(!document.getElementById('webgl-fallback')){
                document.body.insertAdjacentHTML('beforeend','<div id=\"webgl-fallback\" style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#0fc;font-size:18px;text-align:center;z-index:5;\"><div style=\"font-size:48px;margin-bottom:10px\">\u25c8</div>GPU abgestürzt<br><span style=\"font-size:11px;opacity:.6\">Warte auf Wiederherstellung...</span><br><button onclick=\"retryWebGL()\" style=\"margin-top:12px;background:rgba(0,255,136,0.15);border:1px solid #0fc;color:#0fc;padding:6px 16px;border-radius:4px;cursor:pointer;font-family:monospace;\">3D neu starten</button></div>');
            }
        });
        R.domElement.addEventListener('webglcontextrestored',function(){console.log('[GPU] Context restored — rebuilding scene');
            const fb=document.getElementById('webgl-fallback');if(fb)fb.remove();
            rebuildAfterContextLoss();
        });
        return true;
    }catch(e){console.warn('WebGL unavailable',e.message);R=null;
        document.body.insertAdjacentHTML('beforeend','<div id="webgl-fallback" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#0fc;font-size:18px;text-align:center;z-index:5;"><div style="font-size:48px;margin-bottom:10px">◈</div>3D nicht verfügbar<br><span style="font-size:11px;opacity:.6">Events & Metriken sind live</span><br><button onclick="retryWebGL()" style="margin-top:12px;background:rgba(0,255,136,0.15);border:1px solid #0fc;color:#0fc;padding:6px 16px;border-radius:4px;cursor:pointer;font-family:monospace;">3D neu starten</button></div>');
        setTimeout(retryWebGL,3000);return false;
    }
}
function retryWebGL(){
    const fb=document.getElementById('webgl-fallback');if(fb)fb.remove();
    if(initWebGL()){
        controls=new THREE.OrbitControls(cam,R.domElement);controls.enableDamping=true;controls.dampingFactor=0.08;
        if(!G||!Object.keys(G).length)initUniverse();
    }
}
function rebuildAfterContextLoss(){
    // Clear WebGL-dependent objects (all buffers invalid after context loss)
    Object.values(Gg).forEach(g=>{U.remove(g);g.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});});
    Gg={};G={};window.universeNodes={};S.forEach(s=>{s._innerRings=null;s._innerMats=null;});S=[];Sg={};
    pks.forEach(p=>{PkG.remove(p.mesh);if(p.tl)U.remove(p.tl);});pks=[];
    loopTubes.forEach(tb=>{U.remove(tb.mesh);});loopTubes=[];
    pkLabels.forEach(l=>l.e.remove());pkLabels=[];
    galaxyNames=[];systemIds=[];
    // Rebuild with current config
    initUniverse();
}
if(!initWebGL()){/* fallback active */}

if(R){
controls=new THREE.OrbitControls(cam,R.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=15;controls.maxDistance=250;
controls.minPolarAngle=0.2;controls.maxPolarAngle=Math.PI*0.65;
controls.target.set(0,0,0);controls.update();
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const pl=new THREE.PointLight(0x00ffcc,3,200);pl.position.set(0,5,0);scene.add(pl);
const pl2=new THREE.PointLight(0x3388ff,2,150);pl2.position.set(0,-5,20);scene.add(pl2);
cl=new THREE.Clock();
}
const labels=[];

// ═══ PACKET TYPES ═══
const PT={request:{c:0x00ffcc,e:0x00ffcc,s:0.6,n:'Request'},response:{c:0xffaa00,e:0xff8800,s:0.7,n:'Response'},issue:{c:0xff00ff,e:0xff00ff,s:0.7,n:'Issue'},deploy:{c:0x00ffcc,e:0x00ffcc,s:0.6,n:'Deploy'},error:{c:0xff1111,e:0xff3333,s:0.9,n:'Error'},ping:{c:0x333355,e:0x111122,s:0.3,n:'Ping'},data:{c:0xffaa00,e:0xff8800,s:0.5,n:'Data'}};
const TL=25;
const pks=[];
const pkLabels=[];

function mkPkt(type,title,status,sx,sy,sz,ex,ey,ez,spd,style){
    const cfg=PT[type]||PT.issue;
    const st=style||{};
    const color=st.color?parseInt(st.color.replace('#',''),16):cfg.c;
    const emissive=st.color?color:cfg.e;
    const tLen=st.trailLength||TL;
    const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false});
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,16,16),m);mesh.scale.setScalar(cfg.s*1.3);
    mesh.userData={title,status,type:cfg.n,color:'#'+color.toString(16).padStart(6,'0')};
    PkG.add(mesh);
    const tp=new Float32Array(tLen*3);const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
    const tl=new THREE.Line(tg,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));
    PkG.add(tl);
    const pk={mesh,startCT:null,endCT:null,tl,tg,progress:Math.random(),speed:spd||0.003,logged:false,history:[],trailLen:tLen,fadeEffect:st.fadeEffect||null};
    pks.push(pk);
    const lbl=document.createElement('div');lbl.className='packet-label';lbl.textContent=title;lbl.style.borderColor='#'+color.toString(16).padStart(6,'0');document.body.appendChild(lbl);pkLabels.push({e:lbl,p:pk});
    return pk;
}

// ═══ DYNAMIC UNIVERSE BUILDER ═══
let G={},Gg={},S=[],Sg={},loopTubes=[];
window.universeNodes={};
window.universeObjects=window.universeNodes; // alias for console debugging
window.universeLayers={switches:[],hypervisors:[],containers:[],iot:[],trails:[],halos:[]};
let galaxyNames=[],systemIds=[];
const SPREAD=2.5; // galaxy spacing multiplier

// ═══ N-BODY PHYSICS ENGINE ═══
const physicsCfg={
    gravConst:0.5, repulsion:1500, damping:0.85,
    boundary:350, minDist:25
};
let physicsNodes=[];

function initPhysics(){
    physicsNodes=[];
    Object.entries(Sg).forEach(([id,sg])=>{
        const sys=S.find(s=>s.id===id);
        if(!sys)return;
        sg.velocity=sg.velocity||new THREE.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2);
        sg.mass=(sys.capacityScore||100)*0.5;
        sg.force=new THREE.Vector3(0,0,0);
        physicsNodes.push(sg);
    });
}

function updatePhysics(delta,time){
    if(!physicsNodes.length)return;
    // N-Body forces
    for(let i=0;i<physicsNodes.length;i++){
        const a=physicsNodes[i];
        a.force.set(0,0,0);
        const load=a.userData?.load||(a._load||0.3);
        let dynMass=a.mass;
        if(load>0.7){dynMass+=Math.sin(time*0.01+i)*(load*25);}
        for(let j=0;j<physicsNodes.length;j++){
            if(i===j)continue;
            const b=physicsNodes[j];
            const dir=new THREE.Vector3().subVectors(b.position,a.position);
            const dist=dir.length();
            if(dist<0.001)continue;
            if(dist<physicsCfg.minDist){
                a.force.add(dir.clone().normalize().multiplyScalar(-physicsCfg.repulsion/(dist*dist)));
            }
            a.force.add(dir.clone().normalize().multiplyScalar((physicsCfg.gravConst*dynMass*(b.mass||20))/(dist*dist)));
        }
    }
    // Apply forces + boundaries
    physicsNodes.forEach(node=>{
        const acc=node.force.clone().divideScalar(node.mass||20);
        node.velocity.add(acc.multiplyScalar(delta));
        node.velocity.multiplyScalar(physicsCfg.damping);
        node.position.add(node.velocity.clone().multiplyScalar(delta*10));
        ['x','y','z'].forEach(axis=>{
            if(Math.abs(node.position[axis])>physicsCfg.boundary){
                node.position[axis]=Math.sign(node.position[axis])*physicsCfg.boundary;
                node.velocity[axis]*=-0.5;
            }
        });
    });
}

function buildSystems(systems,thresholds){
    S=systems;

    systems.forEach(s=>{
        systemIds.push(s.id);
        const halosCfg=s.halos||[{metricKey:'cpu',baseRadius:4}];
        const halosEnabled=halosCfg.some(h=>h.enabled!==false);
        const cap=s.capacityScore||100;
        const c=s.color||65535;
        const p=Gg[s.g];const sg=new THREE.Group();
        const pos=new THREE.Vector3(s.x,s.y,s.z);
        clampToParent(pos,G[s.g].r);sg.position.copy(pos);p.add(sg);Sg[s.id]=sg;
        // Layer tagging for system group
        const slayer=s.layer||'containers';if(window.universeLayers[slayer])window.universeLayers[slayer].push(sg);

        // ═══ MULTI-HALO SYSTEM: one ring per metric (CPU, RAM, Storage, etc.) ═══
        let outerRings=[],outerMats=[],innerRings=[],innerMats=[];
        if(halosEnabled){
            // Outer ring: static capacity — hidden (controlled by showAllHalos)
            const outerR=halosCfg[0].baseRadius*(cap/maxCap)*1.3;
            const staticOpacity=window._universeCfg?.globalConfig?.defaults?.staticHaloOpacity||0.003;
            [0,Math.PI/2,Math.PI/2].forEach((rot,idx)=>{
                const mat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:staticOpacity,depthWrite:false,side:2,visible:false});
                const ring=new THREE.Mesh(new THREE.RingGeometry(outerR*0.85,outerR,48),mat);
                ring.renderOrder=1;ring.visible=false;

                sg.add(ring);outerRings.push(ring);outerMats.push(mat);
            });
            // Inner rings: one per metric, additive blending for brilliant pulse
            halosCfg.forEach((h,hi)=>{

        p.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(s.x,s.y,s.z)]),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0.1})));

    https:     {what:'REST API-Aufruf',          why:'Service-Kommunikation via Reverse-Proxy',       payload:'JSON Request/Response'},

    return {...d, protocol: proto.toUpperCase(), direction: src+' → '+dst};

function buildConnections(connections){
    connections.forEach(c=>{
        const a=c.from||c[0],b=c.to||c[1];
        const sa=S.find(s=>s.id===a),sb=S.find(s=>s.id===b);
        if(!sa||!sb)return;
        const ga=G[sa.g],gb=G[sb.g];
        const p1=new THREE.Vector3(ga._sx+sa.x,ga._sy+sa.y,ga._sz+sa.z);
        const p2=new THREE.Vector3(gb._sx+sb.x,gb._sy+sb.y,gb._sz+sb.z);
        // Protocol styling
        const proto=c.protocol||'ping';
        const ps=PROTO_STYLES[proto]||PROTO_STYLES.ping;
        const style=c.style||{};
        const glow=style.glowColor||ps.glowColor;
        const lt=style.lineType||ps.lineType;
        const op=style.lineOpacity||ps.opacity;
        const hex=parseInt(glow.replace('#',''),16);
        // Line material
        let mat;
        if(lt==='dashed'){
            mat=new THREE.LineDashedMaterial({color:hex,transparent:true,opacity:op,dashSize:1,gapSize:1});
        }else{
            mat=new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:op});
        }
        const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),mat);
        U.add(line);
        // Tunnel (3D tube with tunnel-type styling)
        if(c.tunnel){
            const ttype=c.tunnelType||c.tunnel||'default';
            const ts=TUNNEL_STYLES[ttype]||TUNNEL_STYLES.default;
            const to=style.tubeOpacity||ts.opacity;
            const tcolor=parseInt(ts.color.replace('#',''),16);
            const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(0.5);mid.y+=3;
            const curve=new THREE.QuadraticBezierCurve3(p1,mid,p2);
            const tMesh=new THREE.Mesh(
                new THREE.TubeGeometry(curve,24,ts.thickness,8,false),
                new THREE.MeshBasicMaterial({color:tcolor,transparent:true,opacity:to,blending:THREE.AdditiveBlending,depthWrite:false})
            );
            U.add(tMesh);
            if(!c._tunnelRefs)c._tunnelRefs=[];
            c._tunnelRefs.push(tMesh);
        }
    });
}

function makeTube(sid1,sid2,tunnelType){
    tunnelType=tunnelType||'default';
    const ts=TUNNEL_STYLES[tunnelType]||TUNNEL_STYLES.default;
    const color=parseInt(ts.color.replace('#',''),16);
    const s1=S.find(s=>s.id===sid1),s2=S.find(s=>s.id===sid2);
    if(!s1||!s2)return;
    const g1=G[s1.g],g2=G[s2.g];
    const p1=new THREE.Vector3(g1._sx+s1.x,g1._sy+s1.y,g1._sz+s1.z);
    const p2=new THREE.Vector3(g2._sx+s2.x,g2._sy+s2.y,g2._sz+s2.z);
    const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(0.5);mid.y+=5;
    const curve=new THREE.QuadraticBezierCurve3(p1,mid,p2);
    const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,32,ts.thickness,8,false),
        new THREE.MeshBasicMaterial({color,transparent:true,opacity:ts.opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
    U.add(mesh);
    const src=window.universeNodes[sid1],dst=window.universeNodes[sid2];
    return {mesh,src,dst,tunnelType};
}

function buildTubes(connections){
    connections.filter(c=>(c.status||c[2])==='active').forEach((c,i)=>{
        const a=c.from||c[0],b=c.to||c[1];
        const ttype=c.tunnelType||c.tunnel||'default';
        const tb=makeTube(a,b,ttype);
        if(tb)loopTubes.push(tb);
    });
    if(loopTubes.length===0&&connections.length>=2){
        const c=connections[0];const a=c.from||c[0],b=c.to||c[1];
        const tb=makeTube(a,b,'default');if(tb)loopTubes.push(tb);
    }
}

function mkPktOnPath(type,title,status,sid1,sid2,spd,style,parentId,payloadHistory){
    const ct1=S.find(s=>s.id===sid1), ct2=S.find(s=>s.id===sid2);
    if(!ct1||!ct2)return;
    const g1=G[ct1.g], g2=G[ct2.g];
    const sx=g1._sx+ct1.x, sy=g1._sy+ct1.y, sz=g1._sz+ct1.z;
    const ex=g2._sx+ct2.x, ey=g2._sy+ct2.y, ez=g2._sz+ct2.z;
    const pk=mkPkt(type,title,status,sx,sy,sz,ex,ey,ez,spd,style);
    if(!pk)return;
    pk.startCT=window.universeNodes[sid1]; pk.endCT=window.universeNodes[sid2];
    pk.parentPacketId=parentId||null;
    pk.payloadHistory=payloadHistory||null;
    // Response badge: "↩" indicator on label
    if(parentId&&pkLabels.length>0){
        const last=document.createElement('span');
        last.style.cssText='color:#fa0;margin-left:4px;font-size:8px;';
        last.textContent='↩';
        pkLabels[pkLabels.length-1].e.appendChild(last);
    }
    // Store galaxy center for via-center routing
    const viaCenter=window._routingRules&&window._routingRules.forceCoreTransit;
    if(viaCenter){
        const gCenter=Gg[ct1.g]?.children[0];
        if(gCenter){const wc=new THREE.Vector3();gCenter.getWorldPosition(wc);pk._galaxyCenter=wc.clone();}
    }
    return pk;
}

function seedPackets(packets, connections){
    if(!R)return;
    const defs=window._universeCfg?.globalConfig?.defaults||{};
    const defTrail=defs.defaultTrailLength||40;
    const defSpeed=defs.defaultSpeed||0.003;
    const defColor=defs.defaultColor||'#00ffcc';
    // Build override map from explicit packets: key = "from→to"
    const overrides={};
    if(packets&&packets.length)packets.forEach(p=>{overrides[p.from+'\u2192'+p.to]=p;});
    // Generate from connections, applying overrides where present
    const conns=connections||[];
    const seen=new Set();
    const pktList=[];
    conns.forEach(c=>{
        const key=c.from+'\u2192'+c.to;
        const ov=overrides[key];
        seen.add(key);
        pktList.push({
            type:ov?.type||'data',
            title:ov?.title||'Auto '+c.from+'\u2192'+c.to,
            status:ov?.status||'OK',
            from:c.from,to:c.to,
            speed:ov?.speed||defSpeed,
            style:ov?.style||{color:defColor,trailLength:defTrail},
            parentPacketId:ov?.parentPacketId||null,
            payloadHistory:ov?.payloadHistory||null
        });
    });
    // Add any explicit packets NOT covered by connections (extra streams)
    if(packets)packets.forEach(p=>{
        const key=p.from+'\u2192'+p.to;
        if(!seen.has(key))pktList.push(p);
    });
    pktList.forEach(p=>{
        const type=p.type||'data',title=p.title||'Packet',status=p.status||'OK';
        const style=p.style||{color:defColor,trailLength:defTrail};
        mkPktOnPath(type,title,status,p.from,p.to,p.speed||defSpeed,style,p.parentPacketId,p.payloadHistory);
    });
}

function getUrlParams(){

// ═══ HOT-RELOAD: SWITCH DATASET ═══
async function switchDataset(datasetId){
    logMsg('Switching to '+datasetId+'...','warning');
    // 1. Dispose old 3D objects
    pks.length=0;
    pkLabels.forEach(l=>l.e.remove());pkLabels.length=0;
    labels.forEach(l=>l.e.remove());labels.length=0;
    loopTubes.length=0;stageList.length=0;
    // Clear universe group
    while(U.children.length>0){
        const child=U.children[0];
        disposeRecursive(child);
        U.remove(child);
    }
    PkG=new THREE.Group();U.add(PkG);
    // Reset state
    G={};Gg={};S=[];Sg={};galaxyNames=[];systemIds=[];
    // 2. Load new dataset
    try{
        const dsRes=await fetch('configs/datasets.json');
        const ds=await dsRes.json();
        const activeDs=ds.datasets.find(d=>d.id===datasetId);
        if(!activeDs)throw new Error('Dataset '+datasetId+' not found');
        const cfgRes=await fetch(activeDs.file);
        const cfg=await cfgRes.json();
        window._universeCfg=cfg;
        window._thresholds=cfg.globalConfig?.thresholds||window._thresholds;
        window._routingRules=cfg.routingRules||{forceCoreTransit:false};
        // 3. Rebuild
        buildGalaxies(cfg.galaxies);
        buildSystems(cfg.systems,window._thresholds);
        buildRoutes(cfg.galaxies);
        buildConnections(cfg.connections||[]);
        buildTubes(cfg.connections||[]);
        buildStages();
        initPhysics();
        buildLegend(cfg.galaxies,cfg.systems);
        seedPackets(cfg.packets,cfg.connections);
        populateSwitcher(ds.datasets,datasetId);
        document.getElementById('main-sidebar').querySelector('h1').textContent=cfg.title||'3D Universe';
        logMsg(datasetId+': '+cfg.galaxies.length+' galaxies, '+cfg.systems.length+' systems','success');
    }catch(e){
        console.error('switchDataset failed:',e);
        logMsg('Switch error: '+e.message,'error');
    }
}

function disposeRecursive(obj){
    if(obj.geometry){obj.geometry.dispose();}
    if(obj.material){
        if(Array.isArray(obj.material))obj.material.forEach(m=>m.dispose());
        else obj.material.dispose();
    }
    if(obj.children)obj.children.forEach(c=>disposeRecursive(c));
}

function initKioskMode(){
    if(!isKiosk)return;
    // Hide HUD + legend + log after 8s of inactivity
    const hud=document.getElementById('main-sidebar');
    const legend=document.getElementById('menu-tree-container');
    const log=document.getElementById('homelab-stream');
    const hideUI=()=>{
        if(kioskActive)return;
        kioskActive=true;
        hud.style.opacity='0';hud.style.transition='opacity 2s';
        legend.style.opacity='0';legend.style.transition='opacity 2s';
        log.style.opacity='0';log.style.transition='opacity 2s';
    };
    const showUI=()=>{
        kioskActive=false;
        hud.style.opacity='1';legend.style.opacity='1';log.style.opacity='1';
        clearTimeout(kioskTimer);
        kioskTimer=setTimeout(hideUI,8000);
    };
    // Mouse/keyboard activity resets timer
    ['mousemove','keydown','click'].forEach(ev=>window.addEventListener(ev,showUI));
    kioskTimer=setTimeout(hideUI,8000);
}

        if(!activeDs)throw new Error('Dataset '+activeId+' not found');

        // 2. Load active config
        const cfgRes=await fetch(activeDs.file);
        const cfg=await cfgRes.json();
        window._universeCfg=cfg;
        window._thresholds=cfg.globalConfig?.thresholds||[
            {maxLoad:0.50,color:'#00ffcc',speedMultiplier:1.0,label:'NORMAL'},
            {maxLoad:0.85,color:'#ffaa00',speedMultiplier:2.2,label:'WARNING'},
            {maxLoad:1.00,color:'#ff3333',speedMultiplier:4.5,label:'CRITICAL'}
        ];
        window._routingRules=cfg.routingRules||{forceCoreTransit:false};

        // 3. Build universe
        buildGalaxies(cfg.galaxies);
        buildSystems(cfg.systems,window._thresholds);
        buildRoutes(cfg.galaxies);
        buildConnections(cfg.connections||[]);
        buildTubes(cfg.connections||[]);
        buildStages();
        initPhysics();
        buildLegend(cfg.galaxies,cfg.systems);
        seedPackets(cfg.packets,cfg.connections);
        populateSwitcher(ds.datasets,activeId);
        document.getElementById('main-sidebar').querySelector('h1').textContent=cfg.title||'3D Universe';

        // 4. Kiosk mode
        initKioskMode();

        // 5. Cockpit (data-driven profiles & filters)
        cockpitReady();

        // 5. Start animation
        if(R)animate();
        logMsg('Universe: '+cfg.galaxies.length+' galaxies, '+cfg.systems.length+' systems','success');
    }catch(e){
        console.error('initUniverse failed:',e);
        logMsg('Config load error: '+e.message,'error');
    }
}


// ═══ ANIMATION ═══
const tv=new THREE.Vector3();
function animate(){
    requestAnimationFrame(animate);
    if(!R)return;
    try{
    const t=cl.getElapsedTime();
    // Oscillating rotation: bounce at ±30° instead of continuous spin
    const rotY = Math.sin(t * 0.08) * 0.5; // ±0.5 rad ≈ ±30°
    U.rotation.y = rotY;
    // Kiosk auto-tour: slow cinematic camera orbit when UI hidden
    if(kioskActive){
        const orbitAngle=t*0.15;const orbitR=80;const orbitH=25;
        cam.position.x=Math.sin(orbitAngle)*orbitR;
        cam.position.z=Math.cos(orbitAngle)*orbitR-20;
        cam.position.y=orbitH+Math.sin(t*0.2)*10;
        cam.lookAt(0,-4,0);
    }
    // Apply universe offset from click-to-center
    U.position.lerp(uniOffset, 0.08);
    // Galaxy load rings: pulse color green→orange→red
    const showHalos=window._universeCfg?.globalConfig?.showAllHalos!==false;
    Object.entries(G).forEach(([id,g])=>{if(g._ring){g._ring.scale.setScalar(0.9+Math.sin(t*3)*0.15);g._ring.material.opacity=0.2+Math.sin(t*3)*0.1;}if(g._haloRings){g._haloRings.forEach(r=>r.visible=showHalos);}});
    Object.values(Gg).forEach(g=>g.rotation.y=Math.sin(t*0.12)*0.3);
    // Orbit systems around galaxy centers (stable, no global physics drift)
    Object.values(Sg).forEach(s=>{
        s.rotation.y+=0.003;
    });

    // ═══ THRESHOLD-DRIVEN MULTI-HALOS (one ring group per metric) ═══
    const thresholds=window._thresholds||[{maxLoad:0.50,color:'#00ffcc',speedMultiplier:1.0},{maxLoad:0.85,color:'#ffaa00',speedMultiplier:2.2},{maxLoad:1.00,color:'#ff3333',speedMultiplier:4.5}];
    S.forEach(s=>{
        const cfg=s._halosCfg||[{metricKey:'cpu',baseRadius:4}];
        if(!s._innerRings||!s._innerRings.length)return;
        const showHalos=window._universeCfg?.globalConfig?.showAllHalos!==false||s._liveMetrics;
        s._innerRings.forEach(r=>r.visible=showHalos);
        if(!showHalos)return;
        const live=s._liveMetrics;
        // Animate each halo group independently based on its metric
        cfg.forEach((h,hi)=>{
            if(h.enabled===false)return;
            // Load per metric: CPU, RAM, disk, or simulated
            let load=0.3;
            if(live){
                if(h.metricKey==='cpu'||h.metricKey==='compute')load=live.cpu/100;
                else if(h.metricKey==='ram'||h.metricKey==='memory')load=live.ram/100;
                else if(h.metricKey==='storage'||h.metricKey==='disk')load=live.disk/100;
                else load=live.cpu/100; // fallback to CPU
            }else{
                if(!s._loads)s._loads={};
                if(!s._loadDirs)s._loadDirs={};
                if(s._loads[hi]===undefined){s._loads[hi]=0.15+Math.random()*0.25;s._loadDirs[hi]=1;}
                s._loads[hi]+=s._loadDirs[hi]*0.002*(0.5+Math.random());
                if(s._loads[hi]>=0.95){s._loads[hi]=0.95;s._loadDirs[hi]=-1;}
                if(s._loads[hi]<=0.05){s._loads[hi]=0.05;s._loadDirs[hi]=1;}
                load=s._loads[hi];
            }
            // Threshold
            let activeTh=thresholds[0];
            for(let i=0;i<thresholds.length;i++){if(load<=thresholds[i].maxLoad){activeTh=thresholds[i];break;}}
            const hex=parseInt(activeTh.color.replace('#',''),16);
            const spd=activeTh.speedMultiplier||1.0;
            // Update this halo's ring group (3 rings per halo, at innerRings[hi*3..hi*3+2])
            const baseIdx=hi*3;
            for(let ri=0;ri<3;ri++){
                const ring=s._innerRings[baseIdx+ri];
                const mat=s._innerMats[baseIdx+ri];
                if(!ring)continue;
                const pump=1.0+Math.sin(t*spd*4+(hi*1.5))*0.12*load;
                ring.scale.setScalar(0.15+load*1.6*pump);
                mat.color.setHex(hex);
                mat.opacity=0.35+load*0.6;
            }
        });
    });

    // Orbit stages
    stageList.forEach(s=>{s.m.position.x=Math.cos(t*0.6+s.angle)*4.5;s.m.position.y=Math.sin(t*0.6+s.angle)*3-1;});

    // Pulse loop tubes + live position update (relative to universeGroup U)
    loopTubes.forEach(tb=>{if(tb&&tb.src&&tb.dst){
        // Pulse emissive
        const s=0.8+Math.sin(t*3)*0.3;tb.mesh.material.emissiveIntensity=s;
        // Get world positions, convert to U-local for geometry
        const sp=new THREE.Vector3();tb.src.getWorldPosition(sp);U.worldToLocal(sp);
        const ep=new THREE.Vector3();tb.dst.getWorldPosition(ep);U.worldToLocal(ep);
        const mid=new THREE.Vector3().addVectors(sp,ep).multiplyScalar(0.5);mid.y+=5;
        const lc=new THREE.QuadraticBezierCurve3(sp,mid,ep);
        tb.mesh.geometry.dispose();
        tb.mesh.geometry=new THREE.TubeGeometry(lc,32,0.7,8,false);
    }});

    // Trail packets: source→target one-way, respawn on arrival
    const viaCenter=window._routingRules&&window._routingRules.forceCoreTransit;
    pks.forEach(p=>{
        // Guard: hide packet if start/end nodes are missing (no 0,0,0 fallback)
        if(!p.startCT||!p.endCT){p.mesh.visible=false;return;}
        p.mesh.visible=true;
        const sp=new THREE.Vector3();p.startCT.getWorldPosition(sp);
        const ep=new THREE.Vector3();p.endCT.getWorldPosition(ep);
        // Linear one-way: 0→1, then respawn at random new path
        p.progress+=Math.abs(p.speed);
        if(p.progress>=1.0){
            // Respawn: only use real connections from config
            const conns=window._universeCfg?.connections||[];
            if(conns.length>0){
                const conn=conns[Math.floor(Math.random()*conns.length)];
                const a=S.find(s=>s.id===conn.from),b=S.find(s=>s.id===conn.to);
                if(a&&b){p.startCT=window.universeNodes[a.id];p.endCT=window.universeNodes[b.id];p.progress=0.0;}
                else{p.progress=0.0;} // restart same path
                // Log packet journey with rich metadata
                if(!p._lastLog||Date.now()-p._lastLog>5000){
                    const detail=getConnDetail(conn.protocol||'tcp', a.name, b.name);
                    addEventTask({
                        text:'📦 '+a.name+'→'+b.name,
                        status:'success',
                        startTime:new Date().toLocaleTimeString(),
                        source:{id:a.id,name:a.name,ipLast:a.ipLast||a.id},
                        target:{id:b.id,name:b.name,ipLast:b.ipLast||b.id},
                        details:{what:detail.what,why:detail.why,protocol:detail.protocol,initiator:detail.payload}
                    });
                    p._lastLog=Date.now();
                }
                // Update galaxy center for via-center routing
                if(viaCenter&&a.g){
                    const gCenter=Gg[a.g]?.children[0];
                    if(gCenter){const wc=new THREE.Vector3();gCenter.getWorldPosition(wc);p._galaxyCenter=wc.clone();}
                }
                // Update label
                const lbl=pkLabels.find(l=>l.p===p);
                if(lbl)lbl.e.textContent=a.name;
            }else{p.progress=0.0;} // fallback: restart same path
            p.history=[]; // clear trail
        }
        // Via-center routing: source → galaxy center → target
        let curPos;
        if(viaCenter){
            // Recalculate galaxy center world position each frame (universe rotates)
            const gc=new THREE.Vector3();
            if(p.startCT){
                // Find parent galaxy group via Sg → Gg
                let found=false;
                for(const[sid,sg]of Object.entries(Sg)){
                    if(window.universeNodes[sid]===p.startCT){
                        const gid=S.find(s=>s.id===sid)?.g;
                        if(gid&&Gg[gid]?.children[0]){
                            Gg[gid].children[0].getWorldPosition(gc);found=true;
                        }
                        break;
                    }
                }
                if(!found)gc.copy(p._galaxyCenter||sp);
            }
            if(p.progress<0.5){
                curPos=new THREE.Vector3().lerpVectors(sp,gc,p.progress*2);
            }else{
                curPos=new THREE.Vector3().lerpVectors(gc,ep,(p.progress-0.5)*2);
            }
        }else{
            curPos=new THREE.Vector3().lerpVectors(sp,ep,p.progress);
        }
        // Fade-in/out at halos: first/last 15% of path
        const FZ=0.15;let op=1.0;
        if(p.progress<FZ)op=p.progress/FZ;
        else if(p.progress>(1.0-FZ))op=(1.0-p.progress)/FZ;
        // Fade-to-center: organic glow as packet approaches target
        if(p.fadeEffect==='glow-to-core'){
            const nearTarget=Math.max(0,1.0-(p.progress<0.5?p.progress*2:(2.0-p.progress*2)));
            op*=0.3+nearTarget*0.7;
            p.mesh.scale.setScalar(PT.request?.s||0.6*(1+nearTarget*0.5));
        }
        p.mesh.material.opacity=Math.max(0.2,op);
        p.tl.material.opacity=Math.max(0.15,op*0.9);
        // Trail: history-based, follow packet from start to current
        const tLen=p.trailLen||TL;
        p.history.unshift(curPos.clone());
        if(p.history.length>tLen)p.history.pop();
        const pa=p.tg.attributes.position;
        for(let i=0;i<tLen;i++){
            if(p.history[i])pa.setXYZ(i,p.history[i].x,p.history[i].y,p.history[i].z);
            else pa.setXYZ(i,curPos.x,curPos.y,curPos.z); // trail starts at current pos
        }
        pa.needsUpdate=true;
        p.mesh.position.copy(curPos);
    });

    // Packet labels: project 3D→2D, update every frame
    pkLabels.forEach(l=>{l.p.mesh.getWorldPosition(tv);tv.project(cam);if(tv.z>=-1&&tv.z<=1){l.e.style.display='block';l.e.style.left=((tv.x*0.5+0.5)*innerWidth)+'px';l.e.style.top=((-tv.y*0.5+0.5)*innerHeight)+'px';}else l.e.style.display='none';});

    // OrbitControls damping update
    if(!kioskActive)controls.update();
    // Smooth camera pan when dirty (click-to-center via orbit target)
    if(camDirty){
        controls.target.lerp(camTarget,0.08);
        if(controls.target.distanceTo(camTarget)<0.5){controls.target.copy(camTarget);camDirty=false;}
    }
    // Labels (nodes): LOD — hide when camera is far
    U.updateMatrixWorld();
    const camDist=cam.position.length();
    labels.forEach(l=>{l.m.getWorldPosition(tv);tv.project(cam);
        if(tv.z>=-1&&tv.z<=1&&camDist<200){l.e.style.display='block';l.e.style.left=((tv.x*0.5+0.5)*innerWidth)+'px';l.e.style.top=((-tv.y*0.5+0.5)*innerHeight)+'px';l.e.style.opacity=Math.max(0.2,1-(camDist/150));}
        else l.e.style.display='none';});
    R.render(scene,cam);
    }catch(e){console.error(e);}
}

        error:{what:'API-Timeout erkannt',why:'Zielservice nicht erreichbar',protocol:'HTTPS',initiator:'gatus'},
    }[type]||{};
    addEventTask({
        text:title,status,startTime:new Date().toLocaleTimeString(),

        source:fromSys?{id:fromSys.id,name:fromSys.name,ipLast:fromSys.ipLast||fromSys.id}:null,

        openInspectModal({

            status: td.status,
            timestamp: td.startTime + (td.endTime ? ' ➔ ' + td.endTime : ''),
            source: td.source || null,
            target: td.target || null,
            what: td.details?.what || td.text,
            why: td.details?.why || '-',
            initiator: td.details?.initiator || 'System',
            protocol: td.details?.protocol || '-',
            size: td.details?.size || '-',
            sourceUrl: td.sourceUrl || null,

        });
    });
    w.appendChild(el);
    if(hc){const cc=document.createElement('div');cc.className='task-children';
        td.children.forEach(ch=>{const ce=document.createElement('div');const cd=ch.endTime?'['+ch.startTime+' ➔ '+ch.endTime+']':'['+ch.startTime+']';ce.className='task-item task-'+ch.status;ce.innerHTML=cd+' ↳ '+ch.text;ce.addEventListener('click',ev=>{ev.stopPropagation();if(ch.sourceUrl)window.open(ch.sourceUrl,'_blank');});cc.appendChild(ce);});
        w.appendChild(cc);}

    if(logHovered){_eventQueue.push(w);}else{c.prepend(w);w.scrollIntoView({behavior:'smooth',block:'start'});}

function initCockpit(cockpitConfig) {
    const container = document.getElementById('cockpit-controls');
    if (!container || !cockpitConfig) return;
    container.innerHTML = '';
    if (cockpitConfig.profiles) {
        const pw = document.createElement('div'); pw.className = 'profile-buttons';
        Object.keys(cockpitConfig.profiles).forEach(key => {
            const prof = cockpitConfig.profiles[key];
            const btn = document.createElement('button');
            btn.innerText = prof.label; btn.className = 'profile-btn';
            if (key === cockpitConfig.defaultProfile) btn.classList.add('active');
            btn.onclick = () => {
                container.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyProfile(key, cockpitConfig);
            };
            pw.appendChild(btn);
        });
        container.appendChild(pw);
    }
    if (cockpitConfig.filters) {
        const fw = document.createElement('div'); fw.className = 'filter-checkboxes';
        cockpitConfig.filters.forEach(filter => {
            const label = document.createElement('label'); label.className = 'checkbox-label';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'filter-' + filter.id;
            cb.checked = filter.default !== false;
            cb.onchange = (e) => toggleLayerVisibility(filter.id, e.target.checked);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + filter.label));
            fw.appendChild(label);
        });
        container.appendChild(fw);
    }
}
function applyProfile(profileKey, config) {
    const profile = config.profiles[profileKey];
    if (!profile) return;
    Object.keys(profile.layers).forEach(layerId => {
        const vis = profile.layers[layerId];
        const cb = document.getElementById('filter-' + layerId);
        if (cb) cb.checked = vis;
        toggleLayerVisibility(layerId, vis);
    });
}
function toggleLayerVisibility(layerId, isVisible) {
    if (window.universeLayers && window.universeLayers[layerId]) {
        window.universeLayers[layerId].forEach(obj => { obj.visible = isVisible; });
    }
}
function cockpitReady() {
    const cfg = window._universeCfg;
    if (cfg && cfg.cockpit) { initCockpit(cfg.cockpit); applyProfile(cfg.cockpit.defaultProfile, cfg.cockpit); }
}

// ═══ LIVE IOT STATUS: Update tree with HA states ═══
function updateIoTStatus(iotData) {
    if (!iotData) return;
    // Map HA entity states to system IDs in the tree
    const stateMap = {};
    for (const [eid, info] of Object.entries(iotData)) {
        const state = info.state || '?';
        // Match HA entities to our system IDs
        if (eid.includes('knx_interface')) stateMap['knx-if'] = state;
        else if (eid.includes('viessmann') || eid.includes('heizung') || eid.includes('vicare')) stateMap['viessmann'] = state;
        else if (eid.includes('shelly') && eid.includes('garten')) stateMap['shelly-garten'] = state;
        else if (eid.includes('shelly') && eid.includes('rack')) stateMap['shelly-rack'] = state;
        else if (eid.includes('anker') || eid.includes('solix')) stateMap['anker-solar'] = state;
    }
    // Update DOM: append state badges to system buttons
    document.querySelectorAll('#sidebar-tree-root [data-sid]').forEach(el => {
        const sid = el.getAttribute('data-sid');
        if (stateMap[sid]) {
            let badge = el.querySelector('.iot-badge');
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'iot-badge';
                badge.style.cssText = 'margin-left:auto;font-size:8px;padding:1px 4px;border-radius:3px;background:rgba(0,255,136,.15);color:#0fc;';
                el.appendChild(badge);
            }
            const s = stateMap[sid];
            if (s === 'on' || s === 'heat' || s === 'heating') { badge.style.color = '#ffaa00'; badge.textContent = 'ON'; }
            else if (s === 'off' || s === 'idle') { badge.style.color = '#666'; badge.textContent = 'OFF'; }
            else if (s === 'unavailable') { badge.style.color = '#f33'; badge.textContent = '⚠'; }
            else if (s.includes('.')) { badge.textContent = s.split('.')[0]; }
            else { badge.textContent = s.substring(0, 8); }
        }
    });
}

// ═══ SIDEBAR TREE-VIEW: Galaxy → Node → CT hierarchy ═══
function initSidebarTree(config) {
    const rootContainer = document.getElementById('sidebar-tree-root');
    if (!rootContainer) return;
    rootContainer.innerHTML = '';

    if (!config || !config.galaxies || !config.systems) return;

    // Separate node systems (isNode:true) from regular CTs
    const nodeSystems = config.systems.filter(s => s.isNode);
    const ctSystems = config.systems.filter(s => !s.isNode);

    config.galaxies.forEach(galaxy => {
        const galaxyDetails = document.createElement('details');
        galaxyDetails.open = true;
        galaxyDetails.style.cssText = "margin-bottom:8px; border-left:2px solid #00ff88; padding-left:8px;";

        const galaxySummary = document.createElement('summary');
        galaxySummary.style.cssText = "cursor:pointer; color:#00ff88; font-weight:bold; font-size:12px; padding:2px 0;";
        galaxySummary.innerHTML = '🌌 ' + (galaxy.name || galaxy.id);
        galaxySummary.onclick = (e) => {
            e.preventDefault();
            focusCameraOnNode(galaxy.id);
            galaxyDetails.open = !galaxyDetails.open;
        };
        galaxyDetails.appendChild(galaxySummary);

        // Find nodes that belong to this galaxy
        const galaxyNodes = nodeSystems.filter(n => n.g === galaxy.id);

        if (galaxyNodes.length === 0) {
            // No nodes: show CTs directly under galaxy (flat fallback)
            const flatCts = ctSystems.filter(s => s.g === galaxy.id);
            const flatList = document.createElement('div');
            flatList.style.cssText = "margin-left:10px; margin-top:2px;";
            flatCts.forEach(sys => {
                flatList.appendChild(makeSystemButton(sys));
            });
            galaxyDetails.appendChild(flatList);
        } else {
            galaxyNodes.forEach(node => {
                const nodeDetails = document.createElement('details');
                nodeDetails.open = true;
                nodeDetails.style.cssText = "margin:4px 0 2px 8px; border-left:2px solid #3388ff; padding-left:6px;";

                const nodeSummary = document.createElement('summary');
                nodeSummary.style.cssText = "cursor:pointer; color:#3388ff; font-weight:bold; font-size:11px; padding:1px 0;";
                nodeSummary.innerHTML = (node.name || node.id);
                nodeSummary.onclick = (e) => {
                    e.preventDefault();
                    focusCameraOnNode(node.id);
                    nodeDetails.open = !nodeDetails.open;
                };
                nodeDetails.appendChild(nodeSummary);

                // CTs under this node
                const nodeCts = ctSystems.filter(s => s.node === node.node || s.g === node.node);
                const ctList = document.createElement('div');
                ctList.style.cssText = "margin-left:8px; margin-top:1px;";

                if (nodeCts.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = "color:#666; font-size:10px; font-style:italic; padding:1px 0;";
                    empty.innerText = "(keine CTs)";
                    ctList.appendChild(empty);
                } else {
                    nodeCts.forEach(sys => {
                        ctList.appendChild(makeSystemButton(sys));
                    });
                }
                nodeDetails.appendChild(ctList);
                galaxyDetails.appendChild(nodeDetails);
            });
        }

        rootContainer.appendChild(galaxyDetails);
    });
}

const _targetCameraPos = new THREE.Vector3();
const _targetControlsTarget = new THREE.Vector3();
const _tempWorldPos = new THREE.Vector3();
let isZooming = false;
let _zoomTargetMesh = null;
let _zoomStartTime = 0;
const ZOOM_DURATION = 600;   // ms (faster)

function focusCameraOnNode(nodeId) {
    let cleanId = nodeId.startsWith('galaxy-') ? nodeId.slice(7) : nodeId;
    let mesh = window.universeNodes?.[cleanId];
    if (!mesh && Gg[cleanId]) mesh = Gg[cleanId].children[0];
    if (!mesh) { console.warn('Node ' + nodeId + ' nicht gefunden.'); return; }

    _zoomTargetMesh = mesh;
    _zoomStartTime = performance.now();

    // Capture start positions once
    if (controls) _targetControlsTarget.copy(controls.target);
    if (cam) _targetCameraPos.copy(cam.position);

    isZooming = true;
    requestAnimationFrame(animateCameraTransition);  // kick off animation loop
    logMsg('Fokus: ' + nodeId, 'success');
}

function animateCameraTransition(now) {
    if (!isZooming || !controls || !cam || !_zoomTargetMesh) {
        isZooming = false; return;
    }

    const elapsed = now - _zoomStartTime;
    let progress = Math.min(elapsed / ZOOM_DURATION, 1.0);
    const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

    _zoomTargetMesh.getWorldPosition(_tempWorldPos);
    const endTarget = _tempWorldPos;
    const endCam = new THREE.Vector3(endTarget.x, endTarget.y + 12, endTarget.z + 25);

    controls.target.lerpVectors(_targetControlsTarget, endTarget, ease);
    cam.position.lerpVectors(_targetCameraPos, endCam, ease);
    controls.update();

    if (progress < 1) {
        requestAnimationFrame(animateCameraTransition);
    } else {
        isZooming = false;
    }
}
fl();setInterval(fl,30000);
// Stream hover-pause: freeze scrolling AND new messages
(function(){
    const stream=document.getElementById('homelab-stream');
    if(stream){
        stream.addEventListener('mouseenter',()=>{logHovered=true;});
        stream.addEventListener('mouseleave',()=>{
            if(document.getElementById('inspect-modal-backdrop').style.display!=='flex'){
                logHovered=false;
                flushEventQueue();
            }
        });
    }
})();
let _eventQueue=[];
function flushEventQueue(){
    if(_eventQueue.length===0)return;
    const c=document.getElementById('stream-messages');
    if(!c)return;
    _eventQueue.forEach(w=>c.prepend(w));
    _eventQueue=[];
}
// Seed event log
setTimeout(()=>{
    addEventTask({text:'Universe initialisiert',status:'success',startTime:new Date().toLocaleTimeString(),endTime:new Date().toLocaleTimeString(),ghost:false,sourceUrl:null});
},1500);
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(R){R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));}});

// ═══ CLICK-TO-CENTER: Universe verschiebt sich zum angeklickten Objekt ═══
let camTarget=new THREE.Vector3(0,0,0),camDirty=false,uniOffset=new THREE.Vector3(0,0,0);
const rc=new THREE.Raycaster();const mc=new THREE.Vector2();
window.addEventListener('click',e=>{
    mc.x=(e.clientX/innerWidth)*2-1;mc.y=-(e.clientY/innerHeight)*2+1;
    rc.setFromCamera(mc,cam);
    const hits=rc.intersectObjects(U.children,true);
    if(hits.length>0){
        let obj=hits[0].object;
        // Packet inspection: show metadata for clicked packet mesh
        if(obj.userData && obj.userData.title){
            const pk=pks.find(p=>p.mesh===obj||p.tl===obj);
            if(pk){
                const srcName=pk.startCT?S.find(s=>window.universeNodes[s.id]===pk.startCT):null;
                const dstName=pk.endCT?S.find(s=>window.universeNodes[s.id]===pk.endCT):null;
                addEventTask({
                    text:'📦 '+obj.userData.title,
                    status:obj.userData.status==='error'?'error':'success',
                    startTime:new Date().toLocaleTimeString(),
                    source:srcName?{id:srcName.id,name:srcName.name}:null,
                    target:dstName?{id:dstName.id,name:dstName.name}:null,
                    details:{what:'Datenpaket im 3D-Universum',why:'Netzwerk-Traffic Simulation',protocol:obj.userData.type||'data'}
                });
                return;
            }
        }
        let tg=obj;
        while(tg.parent&&tg.parent!==U&&tg.parent!==scene)tg=tg.parent;
        const wp=new THREE.Vector3();tg.getWorldPosition(wp);
        uniOffset.copy(wp).negate();
        camTarget.set(0,0,0);camDirty=true;
    }
});
window.addEventListener('dblclick',e=>{uniOffset.set(0,0,0);camTarget.set(0,0,0);camDirty=true;});

// ═══ INSPECTION MODAL: Open/Close/Copy ═══
function openInspectModal(evt){
    document.getElementById('modal-title').innerText = evt.title || 'Ereignis-Details';
    document.getElementById('modal-source').innerHTML = evt.source
        ? evt.source.name+' <span style="color:#666;">(.'+(evt.source.ipLast||evt.source.id)+')</span>'
        : '-';
    document.getElementById('modal-target').innerHTML = evt.target
        ? evt.target.name+' <span style="color:#666;">(.'+(evt.target.ipLast||evt.target.id)+')</span>'
        : '-';
    document.getElementById('modal-what').innerText = evt.what || '-';
    document.getElementById('modal-why').innerText = evt.why || '-';
    document.getElementById('modal-raw-data').value = JSON.stringify(evt, null, 2);
    document.getElementById('inspect-modal-backdrop').style.display = 'flex';
    logHovered = true; // Pause stream while modal open
}
function closeInspectModal(){
    document.getElementById('inspect-modal-backdrop').style.display = 'none';
    logHovered = false;
}
function copyModalContent(){
    const ta = document.getElementById('modal-raw-data');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(()=>{
        const btns = document.querySelectorAll('.modal-footer .action-btn');
        if(btns[0]){const orig=btns[0].innerText;btns[0].innerText='✓ Kopiert!';setTimeout(()=>btns[0].innerText=orig,1500);}
    }).catch(()=>{ta.select();document.execCommand('copy');});
}
