<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Universe Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#020208;color:#00ffcc;font-family:monospace;width:100vw;height:100vh;overflow:hidden;display:flex;}
#tree{width:320px;min-width:280px;height:100vh;overflow-y:auto;background:rgba(5,10,25,.95);border-right:1px solid #0cf3;padding:15px;z-index:10;}
#tree h1{font-size:14px;color:#fff;margin-bottom:2px;letter-spacing:1px;}
#tree .sub{font-size:9px;color:#0cf;margin-bottom:12px;opacity:.7;}
.galaxy{margin:3px 0;border-left:2px solid #08f;padding-left:8px;}
.galaxy>.name{color:#08f;font-weight:bold;font-size:12px;cursor:pointer;padding:3px 0;}
.galaxy>.name:hover{color:#0af;}
.container{margin:2px 0;border-left:1px solid #0f8;padding-left:10px;display:none;}
.galaxy.open>.container{display:block;}
.container>.name{color:#0f8;font-size:11px;padding:2px 0;cursor:pointer;}
.container>.name:hover{color:#5f8;}
.service{margin:1px 0;border-left:1px solid #fa0;padding-left:8px;display:none;}
.container.open>.service{display:block;}
.service>.name{color:#fa0;font-size:10px;padding:1px 0;}
.stage{margin:1px 0;padding-left:6px;font-size:9px;}
.stage::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
.stage.ok::before{background:#0f8;box-shadow:0 0 4px #0f8;}
.stage.busy::before{background:#fa0;box-shadow:0 0 4px #fa0;animation:pulse 1s infinite;}
.stage.error::before{background:#f33;box-shadow:0 0 4px #f33;animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#stats{position:fixed;top:10px;right:10px;background:rgba(5,10,25,.9);border:1px solid #0cf3;border-radius:6px;padding:10px 15px;font-size:11px;z-index:20;}
#stats span{color:#fff;}
#log{position:fixed;bottom:10px;right:10px;left:330px;background:rgba(5,5,15,.9);border:1px solid #0cf3;border-radius:8px;padding:10px;max-height:200px;overflow-y:auto;z-index:10;}
#log .title{color:#0fc;font-size:11px;font-weight:bold;margin-bottom:6px;}
.entry{font-size:10px;padding:2px 5px;margin:1px 0;border-radius:3px;}
.e-ok{border-left:2px solid #0f8;color:#0f8;}
.e-busy{border-left:2px solid #fa0;color:#fa0;}
.e-error{border-left:2px solid #f33;color:#f33;}
#center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5;}
#center .big{font-size:60px;opacity:.15;color:#0cf;text-shadow:0 0 40px #0cf;}
</style>
</head>
<body>
<div id="tree">
<h1>3D UNIVERSE</h1>
<div class="sub">5 Galaxies · 25 Containers · 75 Services · 225 Stages</div>
<div id="galaxies"></div>
</div>
<div id="center"><div class="big">◈</div></div>
<div id="stats">
<div>Uptime: <span id="up">0s</span></div>
<div>Events: <span id="ev">0</span></div>
<div>Errors: <span id="er">0</span></div>
</div>
<div id="log"><div class="title">EVENT STREAM</div><div id="entries"></div></div>

<script>
// ═══ UNIVERSE HIERARCHY ═══
const GALAXIES = ['Alpha','Beta','Gamma','Delta','Epsilon'];
const CONTAINERS = ['C1','C2','C3','C4','C5'];
const SERVICES = ['API','DB','Queue'];
const STAGES = ['boot','health','watchdog'];

// State: stage -> current status
const state = {};
GALAXIES.forEach(g => {
  state[g] = {};
  CONTAINERS.forEach(c => {
    state[g][c] = {};
    SERVICES.forEach(s => {
      state[g][c][s] = {};
      STAGES.forEach(t => { state[g][c][s][t] = 'ok'; });
    });
  });
});

let tick = 0, start = Date.now(), errors = 0;

function setStage(g,c,s,t,status){
  state[g][c][s][t] = status;
  const el = document.getElementById(`st-${g}-${c}-${s}-${t}`);
  if(el){ el.className = 'stage '+status; el.textContent = t + ' ('+status+')'; }
}

function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

// Build DOM tree
const tree = document.getElementById('galaxies');
GALAXIES.forEach(g => {
  const gdiv = document.createElement('div'); gdiv.className = 'galaxy open';
  gdiv.innerHTML = `<div class="name" onclick="this.parentElement.classList.toggle('open')">▶ 🪐 ${g}</div>`;
  CONTAINERS.forEach(c => {
    const cdiv = document.createElement('div'); cdiv.className = 'container open';
    cdiv.innerHTML = `<div class="name" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">▸ 📦 ${c}</div>`;
    SERVICES.forEach(s => {
      const sdiv = document.createElement('div'); sdiv.className = 'service open';
      sdiv.innerHTML = `<div class="name">▹ ⚙ ${s}</div>`;
      STAGES.forEach(t => {
        const st = document.createElement('div');
        st.className = 'stage ok'; st.id = `st-${g}-${c}-${s}-${t}`;
        st.textContent = t + ' (ok)';
        sdiv.appendChild(st);
      });
      cdiv.appendChild(sdiv);
    });
    gdiv.appendChild(cdiv);
  });
  tree.appendChild(gdiv);
});

// Simulate stage changes
function simTick(){
  tick++;
  const g = rnd(GALAXIES), c = rnd(CONTAINERS), s = rnd(SERVICES), t = rnd(STAGES);
  const oldStatus = state[g][c][s][t];
  const r = Math.random();
  const newStatus = oldStatus === 'error' ? (r < .7 ? 'ok' : 'busy') :
                    oldStatus === 'busy' ? (r < .5 ? 'ok' : r < .8 ? 'busy' : 'error') :
                    r < .15 ? 'busy' : r < .04 ? 'error' : 'ok';
  
  if(newStatus !== oldStatus){
    setStage(g,c,s,t,newStatus);
    if(newStatus === 'error') errors++;
    addEvent(g,c,s,t,oldStatus,newStatus);
  }
}

function addEvent(g,c,s,t,from,to){
  const e = document.createElement('div');
  e.className = 'entry e-' + (to === 'error' ? 'error' : to === 'busy' ? 'busy' : 'ok');
  const arrow = to === 'error' ? '🔥' : to === 'busy' ? '⚠' : '✓';
  e.textContent = `[${new Date().toLocaleTimeString()}] ${arrow} ${g}/${c}/${s}/${t}: ${from}→${to}`;
  const entries = document.getElementById('entries');
  entries.insertBefore(e, entries.firstChild);
  if(entries.children.length > 80) entries.lastChild.remove();
}

function updateStats(){
  document.getElementById('up').textContent = Math.floor((Date.now()-start)/1000)+'s';
  document.getElementById('ev').textContent = tick;
  document.getElementById('er').textContent = errors;
}

setInterval(simTick, 150);
setInterval(updateStats, 2000);
updateStats();
</script>
</body>
</html>
