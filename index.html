<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Homelab Universe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020208;color:#0fc;font-family:monospace;padding:16px}
h1{color:#fff;font-size:18px;border-bottom:1px solid rgba(0,255,204,.3);padding-bottom:8px;margin-bottom:12px}
.grid{display:flex;gap:8px;flex-wrap:wrap}
.gx{border:1px solid rgba(0,255,204,.2);border-radius:8px;padding:8px;min-width:170px;background:rgba(0,10,20,.8)}
.gx h3{font-size:12px;color:#08f;margin-bottom:4px;border-bottom:1px solid rgba(0,136,255,.2);padding-bottom:3px}
.ct{font-size:9px;margin:4px 0;padding:3px;background:rgba(0,255,204,.02);border-radius:4px}
.ct b{color:#fff}
.svc{display:flex;gap:4px;margin-top:2px;font-size:8px}
.st{display:inline-block;padding:1px 3px;border-radius:2px;margin:0 1px}
.ok{color:#0f8;background:rgba(0,255,136,.08)}
.busy{color:#fa0;background:rgba(255,170,0,.08)}
.error{color:#f33;background:rgba(255,51,51,.08)}
.log{margin-top:12px;border:1px solid rgba(0,255,204,.2);border-radius:6px;padding:8px;max-height:300px;overflow-y:auto}
.log h4{font-size:10px;color:#0fc;margin-bottom:4px;border-bottom:1px solid rgba(0,255,204,.15);padding-bottom:2px}
.ev{font-size:9px;padding:1px 4px;margin:2px 0;border-left:2px solid #0f8;color:#888}
.stats{font-size:9px;color:#666;margin:8px 0}
</style></head><body>
<h1>◈ HOMELAB UNIVERSE — 5 Galaxies · 25 Container · 75 Services · 225 Stages</h1>
<div class="stats" id="st"></div>
<div style="font-size:9px;color:#888;margin-bottom:6px">Text simulation — <a href="3d.html" style="color:#fa0">Open 3D Universe</a></div>
<div class="grid" id="g"></div>
<div class="log"><h4>EVENT STREAM</h4><div id="el"></div></div>
<script>
var GN=['Alpha','Beta','Gamma','Delta','Epsilon'];
var SN=['API','DB','Queue'];
var TN=['boot','health','watchdog'];
var SS=['ok','ok','ok','ok','busy','error'];
var gd=document.getElementById('g'),ed=document.getElementById('el'),sd=document.getElementById('st');
var n=0,ev=0;
var state={}; // persistent state per entity

function init(){
    GN.forEach(function(g,gi){
        var h='<div class="gx"><h3>💠 '+g+'</h3>';
        for(var ci=1;ci<=5;ci++){
            var id=g+'-'+ci;h+='<div class="ct" id="ct-'+id+'"><b>● '+id+'</b>';
            SN.forEach(function(sv){
                var s=h+='<div class="svc"><span style="color:#888;width:30px;display:inline-block">'+sv+'</span>';
                TN.forEach(function(tn){
                    var stid=id+'-'+sv+'-'+tn;
                    var initial=SS[Math.floor(Math.random()*SS.length)];
                    state[stid]=initial;
                    s+='<span class="st '+initial+'" id="s-'+stid+'">'+tn+'</span> ';
                });
                h=s+'</div>';
            });
            h+='</div>';
        }
        gd.innerHTML+=h+'</div>';
    });
}
function updateStage(id,newStatus){
    var el=document.getElementById('s-'+id);
    if(!el)return;
    el.className='st '+newStatus;
    state[id]=newStatus;
}
function tick(){
    n++;sd.textContent='Tick #'+n+' | Events: '+ev+' | Uptime: '+(n*0.8).toFixed(0)+'s';
    // Pick random entity and stage, change its status
    var g=GN[Math.floor(Math.random()*5)],ci=Math.ceil(Math.random()*5);
    var sv=SN[Math.floor(Math.random()*3)],tn=TN[Math.floor(Math.random()*3)];
    var id=g+'-'+ci+'-'+sv+'-'+tn,ns=SS[Math.floor(Math.random()*SS.length)];
    updateStage(id,ns);
    // Log event
    var cl=ns==='error'?'#f33':ns==='busy'?'#fa0':'#0f8';
    ed.innerHTML+='<div class="ev" style="border-left-color:'+cl+'">['+new Date().toLocaleTimeString()+'] <b>'+g+'-'+ci+'</b> '+sv+'/'+tn+': <span style="color:'+cl+'">'+ns+'</span></div>';
    ev++;if(ed.children.length>80)ed.firstChild.remove();
    ed.parentElement.scrollTop=ed.parentElement.scrollHeight;
}
init();tick();setInterval(tick,600);
</script></body></html>
